<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you | Stefanie Landa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Allura&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { min-height:100vh; display:grid; place-items:center; background:var(--paper2); color:var(--ink); }
    .thank-you { max-width:680px; margin:40px 20px; padding:64px 52px; text-align:center; background:#fffdf8; border:1px solid var(--line); box-shadow:0 12px 30px rgba(35,48,43,.06); }
    .thank-you h1 { font:600 clamp(44px,7vw,72px)/.95 var(--serif); margin:10px 0 22px; }
    .thank-you p { font:20px/1.55 var(--serif); color:#425654; }
    .thank-you .script { font:32px var(--script); color:#536d65; margin:28px 0; }
    .thank-you .button { margin-top:18px; }
  </style>
</head>
<body>
  <main class="thank-you">
    <p class="eyebrow">From her people</p>
    <h1>Thank you for remembering Stef.</h1>
    <p>Your memory has been received. It will be reviewed before it appears on the guest book.</p>
    <p class="script">“There is no ceiling on kindness.”</p>
    <a class="button button-dark" href="/">Back to Stef’s guest book</a>
  </main>
</body>
</html>
